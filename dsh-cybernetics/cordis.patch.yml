# dsh-cybernetics bundle patch — 控制论内核 v5（逻辑控制 + 可靠性 + 跨会话汇总）
#
# 章节依据（钱学森/宋健《工程控制论》第三版）：
#   第十七章 逻辑控制和有限自动机 → logic.mjs 的显式状态机（滞环、单次告警、重复调用）
#   第十九章 冗余技术和容错系统   → reliability.mjs 的 λ/MTBF/k-N 冗余上限与故障分类
#   第二十一章 大系统             → cybernetics_rollup 的跨会话汇总
# 已删除：EMA/pHat、档位（fast/deep/conservative）、稳定阀、熵告警、振荡检测、
# healthScore、adaptiveAlpha、前馈网络规则表。它们对应的是有运动方程的物理受控对象
# （第一章至第十五章），agent 的工具调用不属于那一类。
- insert:
    - id: cybernetics
      name: '@boomzzzzzz/dsh-cybernetics'
      config:
        stateLog: '~/.dsh/cybernetics/state_log.ndjson'
        observedToolsFile: '~/.dsh/cybernetics/observed_tools.json'
        logic:
          # 连续失败阈值（§17.1：三次连续发现目标 → 报警；此处失败即"目标"）
          failStreak: 3
          # 连续成功阈值（§17.1：四次连续无信号 → 解除）
          recoverStreak: 4
          # 确定性故障（沙箱拒绝/权限/参数非法/未知工具）阈值更低：重试同调用 100% 再失败
          deterministicStreak: 2
          # 同一调用（同工具+同参数）连续重复阈值
          repeatAlarm: 3
          repeatExemptTools:
            - job_output
            - job_kill
            - list_agents
            - todo_write
            - cybernetics_status
            - cybernetics_snap
            - cybernetics_rollup
        reliability:
          # 单工具样本少于该值不出 λ（避免小样本给出极端比例）
          minSamples: 5
          # 重试预算：只是报告"预算内可恢复上限"的策略口径，插件不强制
          retryBudget:
            bash: 2
            read: 1
            edit: 1
            write: 0
            web_fetch: 2
            default: 1
        log:
          # 日志轮转：超过 8 MB 转存 .1，保留 3 个历史文件
          maxBytes: 8388608
          keep: 3
