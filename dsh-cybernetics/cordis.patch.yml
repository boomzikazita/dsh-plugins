# dsh-cybernetics bundle patch — 控制论内核 v4 运行时
# 挂载：把 dsh-cybernetics 加入 profile 的 dsh.profile.bundles
# v0.2.1（2026-10-15）：
#   1. 前馈正则修正：YAML 单引号不转义 ⇒ '\\b(...)\\b' 解析成**双反斜杠**，
#      new RegExp(...).test('git status') === false，规则从未命中（实据：516 次
#      pre-execute 带 feedforward 字段 0 条）。改为单反斜杠 '\b(...)\b'。
#   2. 稳定阀基线：窗口已由「每 step 清零」修正为「按 turn 清零」，故基线取 25
#      （原 5 在按 step 口径下永不触发，按 turn 口径下会每轮误报）。
#   注：v0.2.0 起的规则收敛说明——不可逆拦截已不在本插件，「批不批」由宿主审批门
#   （tools/pre-execute 返回 {kind:'ask'} → ctx.approval.request）承担；本机并无名为
#   dsh-approval-gate 的组件（仅 ~/.dsh.sealed 存有 hermes 时代封存副本）。
- insert:
    - id: cybernetics
      name: 'dsh-cybernetics'
      config:
        stateLog: '~/.dsh/cybernetics/state_log.ndjson'
        feedforward:
          # v4.6 P1-5：模式锚定到「命令起始位置」。原 '\b(git|npm|curl|wget|pnpm)\b' 是任意位置匹配，
          # 实测 849 次命中里混进了 `ls .../node_modules/...`、`find -name npm*` 这类纯本地只读命令
          # （命中率 10%，实际拦截 0 次）——每次命中都要往上下文里注入一段警告文本。
          - id: 'network-unstable'
            tools: ['bash']
            pattern: '"command"\s*:\s*"(?:cd\s+\S+\s*&&\s*)?(?:git|npm|curl|wget|pnpm)\b'
            action: { strategy: 'retry+timeout', retry: 2, timeout: 30000 }
        stability:
          # 基线；实际阈值 = 基线 − 档位收缩量（fast 25 / deep 20 / conservative 15，见 core.valveFor）
          maxToolCallsPerTurn: 25
        control:
          # v4.6 P0-2/P0-3 实测标定（309 会话 / 15142 样本，delta 含 bash 退出码，按真实 Δt 回放）：
          #   会话失败率 p50=0% / p75=5.4% / p90=9.8% / p95=13.3%。
          #   escalateAt=0.60 在 17 天里 0 次触发（pHat 会话末值 max=0.111，阈值离分布 5 倍余量）。
          #   escalateAt=0.20 → 25.9% 会话至少升一次档（pHat 72 个 + divergence 20 个），
          #   与「失败率≥5% 的会话占 27.8%」同量级，即只在真正劣化的会话里动手；
          #   降到 0.10 会 40% 会话误升。0.25 会更保守（20.7%），0.20 取的是"异常区持续即升"。
          escalateAt: 0.2
          deescalateAt: 0.15
          alphaLow: 0.15
          dt0Ms: 250
        modes:
          fast: { label: '快速响应' }
          deep: { label: '深度分析' }
          conservative: { label: '保守稳定' }
