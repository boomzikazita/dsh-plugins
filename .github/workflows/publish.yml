name: publish-to-npm
on:
  workflow_dispatch:
    inputs:
      package:
        description: 要发布的包（all = 全部）
        required: true
        type: choice
        options: [all, dsh-context, dsh-cybernetics, dsh-model-fallback, dsh-prompt-diff, dsh-skill-authoring, dsh-skill-fold, dsh-skill-search]
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: 升级 npm（trusted publishing 需 npm>=11.5.1）
        run: npm install -g npm@latest
      - name: 发布
        env:
          PKG: ${{ inputs.package }}
        run: |
          set -e
          pkgs="$PKG"
          [ "$PKG" = "all" ] && pkgs="dsh-context dsh-cybernetics dsh-model-fallback dsh-prompt-diff dsh-skill-authoring dsh-skill-fold dsh-skill-search"
          for d in $pkgs; do
            echo "=== $d ==="
            cd "$d"
            if ls package-lock.json >/dev/null 2>&1; then npm ci || npm install; fi
            npm publish --provenance --access public
            cd ..
          done
